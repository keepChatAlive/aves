on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - run: ./flutterw pub get

      - run: ./flutterw gen-l10n

      - run: |
          # Generate a local debug keystore
          keytool -genkey -v -keystore key.jks -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          mkdir outputs
          scripts/apply_flavor_libre.sh
          ./flutterw build apk -t lib/main_libre.dart --flavor libre --split-per-abi
          cp build/app/outputs/apk/libre/release/*.apk outputs
          rm key.jks
        env:
          AVES_STORE_FILE: ${{ github.workspace }}/key.jks
          AVES_STORE_PASSWORD: android
          AVES_KEY_ALIAS: androiddebugkey
          AVES_KEY_PASSWORD: android
          AVES_GOOGLE_API_KEY: ${{ secrets.AVES_GOOGLE_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: outputs/*
